services:
  mongo:
    image: arm64v8/mongo:4.0
    container_name: unifi-mongo
    restart: unless-stopped

    volumes:
      - ./mongo:/data/db

  unifi:
    image: lscr.io/linuxserver/unifi-network-application:latest
    container_name: unifi
    restart: unless-stopped

    depends_on:
      - mongo

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Jakarta

      - MONGO_USER=unifi
      - MONGO_PASS=unifi123
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_DBNAME=unifi

      - MEM_LIMIT=1024
      - MEM_STARTUP=1024

    ports:
      - 8443:8443
      - 3478:3478/udp
      - 10001:10001/udp
      - 8080:8080
      - 1900:1900/udp
      - 8843:8843
      - 8880:8880
      - 6789:6789
      - 5514:5514/udp

    volumes:
      - ./config:/config
